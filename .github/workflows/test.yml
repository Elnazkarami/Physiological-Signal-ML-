name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ── the core, with no scientific stack at all ───────────────────────────
      # Installed first and deliberately alone. The provenance spine is supposed
      # to be usable without numpy; asserting it needs an environment where numpy
      # genuinely is not present, which is what this half of the job is.
      - name: Install the package and test tooling only
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Verify the package has no runtime dependency
        run: |
          pip install --dry-run --report /tmp/report.json . >/dev/null
          python - <<'PY'
          import json
          report = json.load(open("/tmp/report.json"))
          installed = [i["metadata"]["name"] for i in report["install"]
                       if i["metadata"]["name"].lower() != "physioml"]
          assert not installed, f"runtime dependencies crept in: {installed}"
          print("no runtime dependencies")
          PY

      - name: Verify numpy really is absent
        run: |
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("numpy") is not None:
              sys.exit("numpy is installed; the next step would prove nothing")
          print("numpy absent, as required")
          PY

      - name: Core provenance tests, without a scientific stack
        run: pytest tests/test_core.py -q

      # ── everything else, which does need one ────────────────────────────────
      - name: Install the signal, ML and reference extras
        run: pip install -e ".[dev,signal,ml,reference]"

      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Types
        run: mypy

      - name: Full test suite
        run: coverage run -m pytest -q && coverage report
