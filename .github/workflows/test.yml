name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      # The provenance spine must stay installable with no scientific stack:
      # if the chain of evidence needs numpy to be tested, it has grown into
      # something else.
      - name: Verify the core model has no runtime dependency
        run: |
          pip install --dry-run --report /tmp/report.json . >/dev/null
          python - <<'PY'
          import json
          report = json.load(open("/tmp/report.json"))
          installed = [i["metadata"]["name"] for i in report["install"]
                       if i["metadata"]["name"].lower() != "physioml"]
          assert not installed, f"runtime dependencies crept in: {installed}"
          print("core has no runtime dependencies")
          PY

      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Types
        run: mypy
      - name: Tests
        run: coverage run -m pytest -q && coverage report
